name: Auto-retry failed deploys

on:
  schedule:
    - cron: '*/3 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: auto-retry-deploy
  cancel-in-progress: true

jobs:
  retry:
    runs-on: ubuntu-latest
    steps:
      - name: Re-run failed deployment runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/workflows/deploy.yml/runs?status=failure&per_page=5" \
            --jq '.workflow_runs[] | select(.run_attempt < 5) | .id' | while read -r id; do
              echo "re-running run $id"
              gh api -X POST "repos/${{ github.repository }}/actions/runs/$id/rerun-failed-jobs" || true
            done